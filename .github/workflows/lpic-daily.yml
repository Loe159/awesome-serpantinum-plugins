name: LPIC Daily plugin validation

on:
  push:
    paths:
      - "lpic-daily/**"
      - ".github/workflows/lpic-daily.yml"
  pull_request:
    paths:
      - "lpic-daily/**"
      - ".github/workflows/lpic-daily.yml"

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check plugin manifest and Python launcher
        run: |
          python3 -m json.tool lpic-daily/plugin.json >/dev/null
          python3 -m py_compile lpic-daily/services/launch.py
          python3 -m unittest discover -s lpic-daily/services -p 'test_*.py' -v
      - name: Parse QML
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-declarative-dev-tools
          qmlformat lpic-daily/Plugin.qml >/dev/null
          qmlformat lpic-daily/ui/BarEntry.qml >/dev/null
